<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlindSight reference client</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <section id="key-gate">
    <h1>BlindSight</h1>
    <p>
      This reference client is an ordinary caller of the documented <code>/v1</code> HTTP
      interface -- it holds no privileged access. Enter the shared key given to you out of band.
      It is kept only in this browser's local storage.
    </p>
    <label for="api-key">Shared API key</label>
    <input id="api-key" type="password" autocomplete="off" />
    <button id="save-key" type="button">Save</button>
  </section>

  <main id="app" hidden>
    <button id="tap-target" type="button">
      Tap the center of the screen to record.
    </button>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="conversation" hidden>
      <h2>Ask a follow-up question</h2>
      <label for="question">Your question</label>
      <input id="question" type="text" autocomplete="off" enterkeyhint="send" />
      <button id="ask" type="button">Ask</button>

      <p id="answer" role="status" aria-live="polite"></p>

      <div id="consent" hidden>
        <p id="consent-offer"></p>
        <button id="consent-yes" type="button">Yes, check the captured view</button>
        <button id="consent-no" type="button">No, never mind</button>
      </div>

      <button id="done" type="button">Done</button>
    </section>

    <section id="excerpts-section">
      <h2>Or choose a demonstration excerpt</h2>
      <ul id="excerpts"></ul>
    </section>

    <button id="change-key" type="button">Change API key</button>
  </main>

  <script src="/static/vendor/fixed-webm-duration.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
