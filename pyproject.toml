[project]
name = "blindsight"
version = "0.1.0"
description = "BlindSight Stage 0/1 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "openai>=1.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "types-jsonschema>=4.20",
    "types-PyYAML>=6.0",
    "pillow>=10.0",
    "modal>=1.0",
    "mypy>=1.11",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blindsight*"]
