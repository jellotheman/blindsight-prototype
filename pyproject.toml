[project]
name = "blindsight"
version = "0.1.0"
description = "BlindSight Stage 0/1 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "openai>=1.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "types-jsonschema>=4.20",
    "types-PyYAML>=6.0",
    "pillow>=10.0",
    "modal>=1.0",
    "mypy>=1.11",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "torch>=2.9",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: exercises real Reka/Gemini through a deployed Modal app; secret-gated, skipped by default",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blindsight*"]
